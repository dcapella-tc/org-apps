note: Use the CAL Document Analysis API to identify and extract Indicators, MITRE
  ATT&CK patterns, Intrusion Sets, and Malware families that are potentially referenced
  within a document.<br /> This application specifically requires **TEXT** input for
  its analysis process.<br /><br /> Therefore, if you have binary files as input,
  such as PDFs, DOCX files, or other formats, you must first convert these files into
  plain text.<br /> To do this, use a separate text extraction application (such as
  a \"Content Parser\" Playbook App) to extract the readable text from the binary
  file, and only then can the document be analyzed using the CAL Document Analysis
  API.<br /><br /> Some Apps have binary outputs that contain text, this App will
  accept these binary inputs and process them.<br /><br />The ThreatConnect Doc Analysis
  App has an initial limit of 1000 API calls per day per instance. Please reach out
  to your Customer Success Manager if additional calls are needed. <br /><br />If
  a document is larger than 100 000 characters, the first 100 000 will be used. <br
  /><br />There are five features available for analysis:<br /><br />* **Alias Extraction**  -
  Extracts explicit <a href="https://attack.mitre.org/matrices/enterprise/" target="_blank">MITRE
  ATT&CK Enterprise techniques</a>, sub-techniques, tactics, malware, tools, intrusion
  sets, and courses of action, as well as CVEs, from the provided content.<br /> *
  **IOC Extraction** - Extracts explicit indicators within the content, including
  addresses, file hashes (MD5, SHA256, and SHA1), CIDRs, email addresses, ASNs, hosts,
  and URLs. To reduce noise, items from the CAL Safelist (that is, items marked with
  the <a href="https://knowledge.threatconnect.com/docs/cal-classifiers-glossary"
  target="_blank">Status.Safelist CAL classifier</a>) are excluded. Only hosts and
  email addresses with valid top-level domains (TLDs) from the Internet Assigned Numbers
  Authority (IANA) are included.<br /> * **AI MITRE ATT&CK Classification** - Labels
  report text identified as MITRE ATT&CK techniques and sub-techniques by <a href="https://knowledge.threatconnect.com/docs/mitre-attack-ai-classification-in-threatconnect"
  targe="_blank">ThreatConnect MITRE ATT&CK AI classification feature</a>.<br /> *
  **AI Summary Generation** - Uses an artificial intelligence (AI) large language
  model (LLM) to summarize reports into 200-word summaries and three to five bullet
  points.<br /> * **AI NAICS Industry Classification** - Uses <a href="https://knowledge.threatconnect.com/docs/cal-atl-industry-classification">ThreatConnect
  MITRE ATT&CK AI classification</a> feature to classify subsector-related industries
  and their related sectors based on document content.
