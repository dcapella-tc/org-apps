sections:
- params:
  - label: Action
    name: tc_action
    note: 'Use CAL Document Analysis API in order to identify Indicators, MITRE Attack
      Patterns, Intrusion Sets and Malware families that might be referenced within
      a document. The output consists of arrays of IOCs, CVEs and arrays of names
      and descriptions based on MITRE to support downstream creation of the following
      Group types: Malware, Attack Patterns, Intrusion Sets and Tactics.'
    required: true
    type: Choice
    validValues:
    - Analyze Document
  sectionName: Action
- params:
  - display: tc_action in ('Analyze Document')
    label: Document
    name: document
    note: The document to analyze in order to identify Indicators, MITRE Attack Patterns,
      Intrusion Sets, Malware families and Text Industries, as well as an A.I. summary
    playbookDataType:
    - Binary
    - String
    - TCEntity
    required: true
  - default: Alias Extraction|IOC Extraction|AI Summary Generation
    display: tc_action in ('Analyze Document')
    label: Features
    name: features
    note: The features that will be used to analyze the document. At least one is
      required.
    playbookDataType:
    - StringArray
    required: true
    type: MultiChoice
    validValues:
    - Alias Extraction
    - IOC Extraction
    - AI MITRE ATT&CK Classification
    - AI NAICS Industry Classification
    - AI Summary Generation
  - default: None
    display: '1'
    label: Additional Features
    name: additional_features
    note: Additional features for Doc Analysis
    type: Choice
    validValues:
    - None
    - Zero Day (topic detector)
    - Zero Day Summary (includes topic detector)
  sectionName: Configure
- params:
  - default: false
    label: Fail on error
    name: fail_on_error
    note: If not selected, the app will attempt to continue when an error is encountered.
    type: Boolean
  sectionName: Advanced
